# 24/7 fresh-data watcher for a homelab. Runs `monohunter watch` on the newest
# TESS sector in a loop, resumable and self-healing (v0.4.0 auto-retries errored
# stars on the next cycle). All state + outputs persist in the named volume
# `monohunter-data` (Docker-managed, so it's writable by the image's non-root user
# with no host-side chown — a plain ./data bind mount would be root-owned and the
# unprivileged container user couldn't write it).
#
#   docker compose up -d                              # start the watcher
#   docker compose logs -f                            # follow it
#   docker compose down                               # stop
#   docker compose run --rm watcher sh -lc 'ls /data' # inspect the volume contents
#
# Tune HINT to a sector at or below the current newest one (the watcher probes
# upward from it to auto-detect the freshest sector — keep it close to avoid a
# slow probe from 1).
services:
  watcher:
    image: ghcr.io/rinkia/monohunter:latest
    restart: always
    volumes:
      - monohunter-data:/data
    # The self-healing loop is now a first-class command (monohunter watch-loop): auto-
    # detects the newest sector, scans one resumable cycle, prunes corrupt cached FITS,
    # sleeps, repeats. Same command the Fly.io deployment runs (see docs/deploy-fly.md).
    # --hint: a sector at or below the current newest (the watcher probes upward from it).
    command:
      - watch-loop
      - --hint=90
      - --max=200            # stars per cycle (incremental; resumable)
      - --workers=3          # parallel MAST downloads (modest; MAST-polite)
      - --max-hours=4        # per-cycle watchdog (force-exit a hung cycle; resumable)
      - --sleep=10800        # 3 h between cycles
      - --out=/data/candidates
      - --state=/data/watch_state.json
      - --summaries=/data/summaries
      - --csv-log=/data/sweep.csv

volumes:
  monohunter-data:
