# 24/7 fresh-data watcher for a homelab. Runs `monohunter watch` on the newest
# TESS sector in a loop, resumable and self-healing (v0.4.0 auto-retries errored
# stars on the next cycle). All state + outputs persist in ./data.
#
#   docker compose up -d        # start the watcher
#   docker compose logs -f      # follow it
#   docker compose down         # stop
#
# Tune HINT to a sector at or below the current newest one (the watcher probes
# upward from it to auto-detect the freshest sector — keep it close to avoid a
# slow probe from 1).
services:
  watcher:
    image: ghcr.io/rinkia/monohunter:latest
    restart: always
    environment:
      HINT: "90"        # start probing for the newest sector here (<= current newest)
      MAX: "200"        # stars scanned per cycle (incremental; resumable)
      WORKERS: "3"      # parallel MAST downloads (keep modest; MAST-polite)
      SLEEP: "10800"    # seconds between cycles (3 h)
    volumes:
      - ./data:/data
    entrypoint: ["sh", "-lc"]
    # $$VAR so compose passes a literal $VAR for the in-container shell to expand.
    command: >
      while true; do
        monohunter watch --hint "$$HINT" --max "$$MAX" --workers "$$WORKERS"
          --out /data/candidates --state /data/watch_state.json
          --summaries /data/summaries --csv-log /data/sweep.csv || true;
        find /data/.cache/lightkurve -name '*.fits' -size 65536c -delete 2>/dev/null || true;
        echo "cycle done; sleeping $$SLEEP s"; sleep "$$SLEEP";
      done
