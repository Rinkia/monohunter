# Rebuilds the community leaderboard and deploys it to GitHub Pages whenever a
# contribution lands. One-time setup: repo Settings -> Pages -> Source =
# "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - "contributions/**"
      - "monohunter/swarm/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: monohunter aggregate --contributions contributions --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
