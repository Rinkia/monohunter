# Rebuilds the community leaderboard and deploys it to GitHub Pages whenever a
# contribution lands. One-time setup: repo Settings -> Pages -> Source =
# "GitHub Actions".
#
# Two jobs (build uploads the artifact, deploy publishes it) is the canonical
# structure — it avoids the "Multiple artifacts named github-pages" error you
# hit by re-running a single-job Pages run. If a deploy ever fails, re-run only
# the deploy job, or push/dispatch a fresh run — do NOT re-run an old completed
# run.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "contributions/**"
      - "monohunter/swarm/**"
      - "monohunter/catalog_page.py"
      - "catalogs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: monohunter aggregate --contributions contributions --out _site
      - name: Build a catalog page per sector (auto-discovers catalogs/sector*.csv)
        run: |
          for f in catalogs/sector*.csv; do
            n=$(basename "$f" .csv | sed 's/sector//')
            monohunter catalog-page --csv "$f" --sector "$n" --out "_site/catalog_s${n}.html"
          done
          # legacy landing: keep catalog.html working, redirect to the S15 page
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=catalog_s15.html">\n' > _site/catalog.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
