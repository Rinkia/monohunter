# Rebuilds the community leaderboard and deploys it to GitHub Pages whenever a
# contribution lands. One-time setup: repo Settings -> Pages -> Source =
# "GitHub Actions".
#
# Two jobs (build uploads the artifact, deploy publishes it) is the canonical
# structure — it avoids the "Multiple artifacts named github-pages" error you
# hit by re-running a single-job Pages run. If a deploy ever fails, re-run only
# the deploy job, or push/dispatch a fresh run — do NOT re-run an old completed
# run.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "contributions/**"
      - "monohunter/swarm/**"
      - "monohunter/catalog_page.py"
      - "catalogs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: monohunter aggregate --contributions contributions --out _site
      - run: monohunter catalog-page --csv catalogs/sector15.csv --sector 15 --out _site/catalog.html
      - run: monohunter catalog-page --csv catalogs/sector16.csv --sector 16 --out _site/catalog_s16.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
